<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>祝福牆 | 顏朱府囍宴</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #2d2424 0%, #3d3030 50%, #2a2020 100%);
      font-family: 'Wix Madefor Text', 'Noto Sans TC', sans-serif;
      color: #fff;
    }

    /* Decorative background */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(179, 144, 144, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(179, 144, 144, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.03) 0%, transparent 30%);
      animation: bgFloat 30s ease-in-out infinite;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(45, 36, 36, 0.95) 0%, rgba(45, 36, 36, 0.8) 50%, transparent 100%);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .header .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .header .stats span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header .stats .count {
      font-weight: 700;
      font-size: 18px;
      color: #e8c4c4;
    }

    /* Waiting screen */
    .waiting-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.5s ease;
    }

    .waiting-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .waiting-screen .icon {
      font-size: 80px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }

    .waiting-screen .text {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.5);
    }

    .waiting-screen .subtext {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }

    /* ============================================
       DANMAKU (Bullet Comments) Container
       ============================================ */
    .danmaku-container {
      position: fixed;
      top: 80px;
      left: 0;
      width: 100%;
      height: calc(100% - 80px);
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .danmaku {
      position: absolute;
      white-space: nowrap;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      background: linear-gradient(135deg, rgba(179, 144, 144, 0.85), rgba(149, 130, 130, 0.85));
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transform: translateX(100vw);
      animation: danmakuScroll linear forwards;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .danmaku .sender {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
    }

    .danmaku .message {
      max-width: 600px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes danmakuScroll {
      0% {
        transform: translateX(100vw);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    /* ============================================
       PHOTO Display Container
       ============================================ */
    .photo-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .photo-card {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .photo-card.fade-out {
      opacity: 0;
    }

    .photo-card img {
      display: block;
      max-width: 350px;
      max-height: 300px;
      width: auto;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
    }

    .photo-card .photo-sender {
      margin-top: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #5a4a4a;
    }

    /* Photo entrance animations */
    @keyframes photoEnterFromRight {
      0% { transform: translateX(100vw) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(0) rotate(-2deg); opacity: 1; }
    }

    @keyframes photoEnterFromLeft {
      0% { transform: translateX(-100vw) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(0) rotate(2deg); opacity: 1; }
    }

    @keyframes photoEnterFromTop {
      0% { transform: translateY(-100vh) rotate(6deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(0) rotate(-3deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottom {
      0% { transform: translateY(100vh) rotate(-6deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(0) rotate(3deg); opacity: 1; }
    }

    @keyframes photoEnterFromTopRight {
      0% { transform: translate(100vw, -100vh) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(-2deg); opacity: 1; }
    }

    @keyframes photoEnterFromTopLeft {
      0% { transform: translate(-100vw, -100vh) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(2deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottomRight {
      0% { transform: translate(100vw, 100vh) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(3deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottomLeft {
      0% { transform: translate(-100vw, 100vh) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(-3deg); opacity: 1; }
    }

    /* QR Code section */
    .qr-section {
      position: fixed;
      bottom: 30px;
      right: 30px;
      text-align: center;
      z-index: 100;
    }

    .qr-section .qr-box {
      width: 120px;
      height: 120px;
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .qr-section .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-section .qr-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .control-btn {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .control-btn .material-symbols-outlined {
      font-size: 22px;
    }

    /* Floating hearts */
    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      animation: floatUp 8s ease-out forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 15px 20px;
      }

      .header h1 {
        font-size: 18px;
      }

      .danmaku {
        font-size: 18px;
        padding: 8px 16px;
      }

      .danmaku .sender {
        font-size: 14px;
      }

      .photo-card img {
        max-width: 250px;
        max-height: 200px;
      }

      .qr-section .qr-box {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>

  <header class="header">
    <h1>💕 祝福牆</h1>
    <div class="stats">
      <span>
        <span class="material-symbols-outlined">chat</span>
        文字 <span class="count" id="textCount">0</span>
      </span>
      <span>
        <span class="material-symbols-outlined">photo_camera</span>
        照片 <span class="count" id="photoCount">0</span>
      </span>
    </div>
  </header>

  <div class="waiting-screen" id="waitingScreen">
    <div class="material-symbols-outlined icon">hourglass_empty</div>
    <div class="text">等待祝福中...</div>
    <div class="subtext">掃描 QR Code 送上您的祝福</div>
  </div>

  <div class="danmaku-container" id="danmakuContainer"></div>
  <div class="photo-container" id="photoContainer"></div>
  <div class="hearts-container" id="heartsContainer"></div>

  <div class="qr-section">
    <div class="qr-box">
      <img src="./qr.png" alt="QR Code">
    </div>
    <div class="qr-text">掃描送祝福</div>
  </div>

  <div class="controls">
    <button class="control-btn" id="pauseBtn" title="暫停/播放">
      <span class="material-symbols-outlined" id="pauseIcon">pause</span>
    </button>
    <button class="control-btn" id="fullscreenBtn" title="全螢幕">
      <span class="material-symbols-outlined">fullscreen</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onChildRemoved } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDD-klcHuiIXBY9f4rjuDR-7aDyKrXICv0",
      authDomain: "wedding-e335c.firebaseapp.com",
      databaseURL: "https://wedding-e335c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wedding-e335c",
      storageBucket: "wedding-e335c.firebasestorage.app",
      messagingSenderId: "89341612270",
      appId: "1:89341612270:web:afa62ef0c5b51f5130a3ff"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ============================================
    // State
    // ============================================
    let textBlessings = [];
    let photoBlessings = [];
    let textQueue = [];
    let photoQueue = [];
    let activePhotos = []; // Max 2 photos on screen { id, element, position }
    let activeDanmakuIds = new Set(); // Track currently visible danmaku
    let lastPhotoPosition = 1; // Track last used position to alternate (0=left, 1=right)
    let isPlaying = true;
    let danmakuInterval = null;
    let photoInterval = null;

    // Settings
    const DANMAKU_INTERVAL = 3000; // New danmaku every 3 seconds
    const DANMAKU_DURATION = 12000; // Time to cross screen (12 seconds)
    const PHOTO_DISPLAY_TIME = 8000; // Photo stays for 8 seconds
    const PHOTO_INTERVAL = 5000; // New photo every 5 seconds
    const MAX_PHOTOS_ON_SCREEN = 2;
    const DANMAKU_LANES = 6; // Number of vertical lanes

    // Track lane usage for danmaku
    let laneLastUsed = Array(DANMAKU_LANES).fill(0);

    // Preloaded images cache
    const preloadedImages = new Map();

    // ============================================
    // DOM Elements
    // ============================================
    const waitingScreen = document.getElementById('waitingScreen');
    const danmakuContainer = document.getElementById('danmakuContainer');
    const photoContainer = document.getElementById('photoContainer');
    const heartsContainer = document.getElementById('heartsContainer');
    const textCountEl = document.getElementById('textCount');
    const photoCountEl = document.getElementById('photoCount');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // ============================================
    // Floating Hearts Animation
    // ============================================
    const hearts = ['💕', '❤️', '💗', '💖', '💝', '💘', '🥰', '😍'];
    
    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (6 + Math.random() * 4) + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createFloatingHeart, 4000);

    // ============================================
    // DANMAKU (Text Blessings)
    // ============================================
    function getAvailableLane() {
      const now = Date.now();
      let bestLane = 0;
      let oldestTime = laneLastUsed[0];
      
      for (let i = 0; i < DANMAKU_LANES; i++) {
        if (now - laneLastUsed[i] > 2000) {
          laneLastUsed[i] = now;
          return i;
        }
        if (laneLastUsed[i] < oldestTime) {
          oldestTime = laneLastUsed[i];
          bestLane = i;
        }
      }
      
      laneLastUsed[bestLane] = now;
      return bestLane;
    }

    function createDanmaku(blessing) {
      // Track this danmaku as active
      activeDanmakuIds.add(blessing.id);
      
      const lane = getAvailableLane();
      const laneHeight = (danmakuContainer.offsetHeight - 100) / DANMAKU_LANES;
      const topPosition = 50 + lane * laneHeight;

      const danmaku = document.createElement('div');
      danmaku.className = 'danmaku';
      danmaku.style.top = topPosition + 'px';
      danmaku.style.animationDuration = DANMAKU_DURATION + 'ms';
      danmaku.dataset.id = blessing.id;
      
      danmaku.innerHTML = `
        <span class="sender">${escapeHtml(blessing.name)}</span>
        <span class="message">${escapeHtml(blessing.message)}</span>
      `;

      danmakuContainer.appendChild(danmaku);

      // Create hearts burst
      for (let i = 0; i < 3; i++) {
        setTimeout(createFloatingHeart, i * 150);
      }

      // Remove after animation and clear from active set
      setTimeout(() => {
        danmaku.remove();
        activeDanmakuIds.delete(blessing.id);
      }, DANMAKU_DURATION + 500);
    }

    function showNextDanmaku() {
      if (!isPlaying) return;
      
      if (textQueue.length > 0) {
        const blessing = textQueue.shift();
        textBlessings.push(blessing);
        createDanmaku(blessing);
        waitingScreen.classList.add('hidden');
      } else if (textBlessings.length > 0) {
        // Recycle - but avoid duplicates on screen
        const availableBlessings = textBlessings.filter(b => !activeDanmakuIds.has(b.id));
        
        if (availableBlessings.length > 0) {
          const randomIndex = Math.floor(Math.random() * availableBlessings.length);
          createDanmaku(availableBlessings[randomIndex]);
          waitingScreen.classList.add('hidden');
        }
        // If all are already on screen, skip this cycle
      }
    }

    // ============================================
    // PHOTO Blessings
    // ============================================
    const photoAnimations = [
      'photoEnterFromRight',
      'photoEnterFromLeft',
      'photoEnterFromTop',
      'photoEnterFromBottom',
      'photoEnterFromTopRight',
      'photoEnterFromTopLeft',
      'photoEnterFromBottomRight',
      'photoEnterFromBottomLeft'
    ];

    // Preload an image and cache it
    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        if (preloadedImages.has(url)) {
          resolve(preloadedImages.get(url));
          return;
        }
        
        const img = new Image();
        img.onload = () => {
          preloadedImages.set(url, img);
          resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // Get next position (alternates left/right)
    function getNextPhotoPosition() {
      // Check which positions are currently in use
      const usedPositions = new Set(activePhotos.map(p => p.position));
      
      // If a position is free, use it
      if (!usedPositions.has(0)) return 0;
      if (!usedPositions.has(1)) return 1;
      
      // Both positions in use (shouldn't happen due to MAX check), alternate
      lastPhotoPosition = lastPhotoPosition === 0 ? 1 : 0;
      return lastPhotoPosition;
    }

    // Get centered position with some randomness
    function getCenteredPosition(position) {
      const cardWidth = 380; // Approximate card width
      const cardHeight = 380; // Approximate card height
      const headerHeight = 100;
      const bottomMargin = 200; // For QR and controls
      
      const availableWidth = window.innerWidth - cardWidth;
      const availableHeight = window.innerHeight - headerHeight - bottomMargin - cardHeight;
      
      // Center area with slight offset based on position
      const centerX = availableWidth / 2;
      const centerY = headerHeight + availableHeight / 2;
      
      // Offset for multiple photos (left/right of center)
      let offsetX = 0;
      if (position === 0) {
        offsetX = -availableWidth * 0.15; // Left of center
      } else if (position === 1) {
        offsetX = availableWidth * 0.15; // Right of center
      }
      
      // Add small random variation
      const randomX = (Math.random() - 0.5) * 100;
      const randomY = (Math.random() - 0.5) * 80;
      
      return {
        x: Math.max(30, Math.min(centerX + offsetX + randomX, availableWidth - 30)),
        y: Math.max(headerHeight + 20, centerY + randomY)
      };
    }

    async function createPhotoCard(blessing) {
      if (activePhotos.length >= MAX_PHOTOS_ON_SCREEN) {
        return false;
      }

      // Preload image first
      try {
        await preloadImage(blessing.photoURL);
      } catch (e) {
        console.warn('Failed to preload image:', e);
        return false;
      }

      // Get the next position (alternates left/right)
      const position = getNextPhotoPosition();
      lastPhotoPosition = position; // Track for alternation
      
      const pos = getCenteredPosition(position);
      const animation = photoAnimations[Math.floor(Math.random() * photoAnimations.length)];

      const card = document.createElement('div');
      card.className = 'photo-card'; // Show immediately since image is preloaded
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';
      card.style.animation = `${animation} 1.5s ease-out forwards`;
      card.dataset.id = blessing.id;

      card.innerHTML = `
        <img src="${blessing.photoURL}" alt="Photo">
        <div class="photo-sender">來自 ${escapeHtml(blessing.name)}</div>
      `;

      photoContainer.appendChild(card);
      activePhotos.push({ id: blessing.id, element: card, position: position });

      // Create hearts burst
      for (let i = 0; i < 5; i++) {
        setTimeout(createFloatingHeart, i * 100);
      }

      // Store final transform for use when fading out
      let savedTransform = 'none';
      
      // After entrance animation ends, preserve transform and clear animation
      card.addEventListener('animationend', () => {
        // Get the final computed transform from the animation
        const computedStyle = window.getComputedStyle(card);
        savedTransform = computedStyle.transform;
        
        // Apply it as inline style and clear animation
        card.style.transform = savedTransform;
        card.style.animation = 'none';
      }, { once: true });

      // Remove after display time
      setTimeout(() => {
        // Apply scale with existing transform
        card.style.transform = savedTransform + ' scale(0.85)';
        card.classList.add('fade-out');
        setTimeout(() => {
          card.remove();
          activePhotos = activePhotos.filter(p => p.id !== blessing.id);
        }, 500);
      }, PHOTO_DISPLAY_TIME);
      
      return true;
    }

    async function showNextPhoto() {
      if (!isPlaying) return;
      if (activePhotos.length >= MAX_PHOTOS_ON_SCREEN) return;

      // Get IDs of currently displayed photos
      const activePhotoIds = new Set(activePhotos.map(p => p.id));

      if (photoQueue.length > 0) {
        const blessing = photoQueue.shift();
        photoBlessings.push(blessing);
        // Preload next in queue while showing this one
        if (photoQueue.length > 0) {
          preloadImage(photoQueue[0].photoURL).catch(() => {});
        }
        await createPhotoCard(blessing);
        waitingScreen.classList.add('hidden');
      } else if (photoBlessings.length > 0) {
        // Recycle - but avoid duplicates on screen
        const availablePhotos = photoBlessings.filter(b => !activePhotoIds.has(b.id));
        
        if (availablePhotos.length > 0) {
          const randomIndex = Math.floor(Math.random() * availablePhotos.length);
          await createPhotoCard(availablePhotos[randomIndex]);
          waitingScreen.classList.add('hidden');
        }
        // If all are already on screen, skip this cycle
      }
    }

    // ============================================
    // Firebase Listeners
    // ============================================
    const blessingsRef = ref(db, 'blessings');

    onChildAdded(blessingsRef, (snapshot) => {
      const blessing = { id: snapshot.key, ...snapshot.val() };
      
      // Skip private blessings
      if (blessing.private === true) return;

      // Separate by type
      if (blessing.type === 'photo' && blessing.photoURL) {
        // Check if already exists
        if (!photoBlessings.some(b => b.id === blessing.id) && 
            !photoQueue.some(b => b.id === blessing.id)) {
          // Preload image immediately when added to queue
          preloadImage(blessing.photoURL).catch(() => {});
          photoQueue.push(blessing);
          photoCountEl.textContent = photoBlessings.length + photoQueue.length;
        }
      } else if (blessing.message) {
        // Check if already exists
        if (!textBlessings.some(b => b.id === blessing.id) &&
            !textQueue.some(b => b.id === blessing.id)) {
          textQueue.push(blessing);
          textCountEl.textContent = textBlessings.length + textQueue.length;
        }
      }

      // Hide waiting screen if we have content
      if (textQueue.length > 0 || photoQueue.length > 0 || textBlessings.length > 0 || photoBlessings.length > 0) {
        waitingScreen.classList.add('hidden');
      }
    });

    onChildRemoved(blessingsRef, (snapshot) => {
      const deletedId = snapshot.key;
      
      // Remove from text
      textQueue = textQueue.filter(b => b.id !== deletedId);
      textBlessings = textBlessings.filter(b => b.id !== deletedId);
      
      // Remove from photo
      photoQueue = photoQueue.filter(b => b.id !== deletedId);
      photoBlessings = photoBlessings.filter(b => b.id !== deletedId);
      
      // Remove active photo if displayed
      const activePhoto = activePhotos.find(p => p.id === deletedId);
      if (activePhoto) {
        activePhoto.element.remove();
        activePhotos = activePhotos.filter(p => p.id !== deletedId);
      }

      // Update counts
      textCountEl.textContent = textBlessings.length + textQueue.length;
      photoCountEl.textContent = photoBlessings.length + photoQueue.length;

      // Show waiting if empty
      if (textBlessings.length === 0 && photoBlessings.length === 0 && 
          textQueue.length === 0 && photoQueue.length === 0) {
        waitingScreen.classList.remove('hidden');
      }
    });

    // ============================================
    // Start Display Loops
    // ============================================
    function startDisplayLoops() {
      danmakuInterval = setInterval(showNextDanmaku, DANMAKU_INTERVAL);
      photoInterval = setInterval(showNextPhoto, PHOTO_INTERVAL);
    }

    function stopDisplayLoops() {
      clearInterval(danmakuInterval);
      clearInterval(photoInterval);
    }

    // Start after a short delay
    setTimeout(startDisplayLoops, 2000);

    // ============================================
    // Controls
    // ============================================
    pauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      pauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      
      if (isPlaying) {
        startDisplayLoops();
      } else {
        stopDisplayLoops();
      }
    });

    fullscreenBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });

    // ============================================
    // Utility
    // ============================================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
