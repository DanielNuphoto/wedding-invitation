<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>祝福牆 | 顏朱府囍宴</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" />
  <style>
    :root {
      --text-scale: 1;
      --photo-scale: 1;
      --emoji-sender-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      background: #112e52; /* Root background to prevent white flash on overscroll */
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a3a5c 0%, #112e52 50%, #0a1f3a 100%);
      font-family: 'Wix Madefor Text', 'Noto Sans TC', sans-serif;
      color: #fff;
    }

    /* Split Background Sections */
    .bg-split-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 1;
      pointer-events: none;
    }

    .bg-half {
      width: 50%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-media-wrapper {
      position: absolute;
      border-radius: 24px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .bg-media-wrapper.active {
      opacity: 1;
    }

    .bg-half-media {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Decorative background */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(20, 40, 60, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(15, 35, 55, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(25, 45, 65, 0.06) 0%, transparent 30%);
      animation: bgFloat 30s ease-in-out infinite;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(9, 25, 45, 0.95) 0%, rgba(9, 25, 45, 0.8) 50%, transparent 100%);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .header .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .header .stats span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header .stats .count {
      font-weight: 700;
      font-size: 18px;
      color: #f5c8c8;
    }

    /* Waiting screen */
    .waiting-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.5s ease;
    }

    .waiting-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .waiting-screen .icon {
      font-size: 80px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }

    .waiting-screen .text {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.5);
    }

    .waiting-screen .subtext {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }

    /* ============================================
       DANMAKU (Bullet Comments) Container
       ============================================ */
    .danmaku-container {
      position: fixed;
      top: 80px;
      left: 0;
      width: 100%;
      height: calc(100% - 80px);
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }

    .danmaku {
      position: absolute;
      white-space: nowrap;
      padding: calc(var(--text-scale, 1) * 15px) calc(var(--text-scale, 1) * 30px);
      border-radius: calc(var(--text-scale, 1) * 35px);
      font-size: calc(var(--text-scale, 1) * 72px);
      font-weight: 500;
      color: #fff;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      background: linear-gradient(135deg, rgba(200, 150, 150, 0.88), rgba(180, 130, 130, 0.88));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transform: translateX(100vw);
      animation: danmakuScroll linear forwards;
      display: flex;
      align-items: center;
      gap: calc(var(--text-scale, 1) * 20px);
    }

    .danmaku .sender {
      background: rgba(255, 255, 255, 0.25);
      padding: calc(var(--text-scale, 1) * 8px) calc(var(--text-scale, 1) * 20px);
      border-radius: calc(var(--text-scale, 1) * 25px);
      font-size: calc(var(--text-scale, 1) * 48px);
      font-weight: 600;
    }

    @keyframes danmakuScroll {
      0% {
        transform: translateX(100vw);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    /* ============================================
       PHOTO Display Container
       ============================================ */
    .photo-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .photo-card {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      border-radius: calc(var(--photo-scale, 1) * 24px);
      padding: calc(var(--photo-scale, 1) * 20px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
      overflow: hidden;
      box-sizing: border-box;
      transform-origin: center center;
    }

    .photo-card.fade-out {
      opacity: 0;
    }

    .photo-card img,
    .photo-card video {
      display: block;
      width: auto; /* Let JavaScript set the size */
      height: auto; /* Maintain aspect ratio */
      max-width: 100%; /* Never exceed card content area */
      max-height: 100%; /* Never exceed card content area */
      border-radius: calc(var(--photo-scale, 1) * 16px);
      object-fit: contain; /* Show full media without cropping */
      box-sizing: border-box; /* Include border/padding in size calculations */
    }

    .photo-card video {
      background: #000;
    }

    .photo-card .photo-sender {
      margin-top: calc(var(--photo-scale, 1) * 16px);
      text-align: center;
      font-size: calc(var(--photo-scale, 1) * 32px);
      font-weight: 600;
      color: #0f1f33;
    }

    /* Photo entrance animations */
    @keyframes photoEnterFromRight {
      0% { transform: translateX(100vw) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(0) rotate(-2deg); opacity: 1; }
    }

    @keyframes photoEnterFromLeft {
      0% { transform: translateX(-100vw) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(0) rotate(2deg); opacity: 1; }
    }

    @keyframes photoEnterFromTop {
      0% { transform: translateY(-100vh) rotate(6deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(0) rotate(-3deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottom {
      0% { transform: translateY(100vh) rotate(-6deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(0) rotate(3deg); opacity: 1; }
    }

    @keyframes photoEnterFromTopRight {
      0% { transform: translate(100vw, -100vh) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(-2deg); opacity: 1; }
    }

    @keyframes photoEnterFromTopLeft {
      0% { transform: translate(-100vw, -100vh) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(2deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottomRight {
      0% { transform: translate(100vw, 100vh) rotate(-8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(3deg); opacity: 1; }
    }

    @keyframes photoEnterFromBottomLeft {
      0% { transform: translate(-100vw, 100vh) rotate(8deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 0) rotate(-3deg); opacity: 1; }
    }

    /* QR Code section */
    .qr-section {
      position: fixed;
      bottom: 30px;
      right: 30px;
      text-align: center;
      z-index: 100;
    }

    .qr-section .qr-box {
      width: 120px;
      height: 120px;
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .qr-section .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-section .qr-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .control-btn {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .control-btn .material-symbols-outlined {
      font-size: 22px;
    }

    /* Floating hearts */
    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      animation: floatUp 8s ease-out forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    /* Emoji Blast Container */
    .emoji-blast-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
      overflow: hidden;
    }

    .emoji-blast {
      position: absolute;
      bottom: 0;
      font-size: 32px;
        opacity: 0;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
      will-change: transform, opacity;
    }

    .emoji-blast-sender {
      position: absolute;
      bottom: calc(var(--emoji-sender-scale, 1) * 20px);
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(220, 190, 140, 0.95), rgba(200, 165, 115, 0.95));
      padding: calc(var(--emoji-sender-scale, 1) * 8px) calc(var(--emoji-sender-scale, 1) * 18px);
      border-radius: calc(var(--emoji-sender-scale, 1) * 25px);
      font-size: calc(var(--emoji-sender-scale, 1) * 16px);
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      z-index: 150; /* Above controls and QR */
      animation: senderFadeInOut 3s ease-out forwards;
    }

    @keyframes senderFadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
    }

    /* Settings Panel */
    #settingsToggle.active .material-symbols-outlined {
      transform: rotate(90deg);
    }

    .settings-panel {
      position: fixed;
      bottom: 90px;
      left: 30px;
      width: 320px;
      background: rgba(74, 56, 56, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
        opacity: 0;
      transition: all 0.35s ease;
      backdrop-filter: blur(20px);
      z-index: 200;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .settings-panel.open {
      max-height: 400px;
      padding: 24px;
      opacity: 1;
    }

    .settings-panel h3 {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-panel h3 .material-symbols-outlined {
      font-size: 20px;
      color: #f0c8c8;
    }

    .setting-item {
      margin-bottom: 20px;
    }

    .setting-item:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    .setting-value {
      font-weight: 600;
      color: #f0c8c8;
      font-size: 13px;
    }

    .setting-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .setting-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0c0c0, #dca8a8);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .setting-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .setting-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0c0c0, #dca8a8);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .setting-presets {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .preset-btn {
      flex: 1;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .preset-btn.active {
      background: rgba(240, 192, 192, 0.3);
      border-color: #e8c0c0;
      color: #f0c8c8;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 15px 20px;
      }

      .header h1 {
        font-size: 18px;
      }

      .qr-section .qr-box {
        width: 80px;
        height: 80px;
      }

      .settings-panel {
        width: 280px;
        left: 10px;
      }
    }

    /* Awards Overlay */
    .awards-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .awards-overlay.show {
      display: flex;
    }

    .awards-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
        width: 50px;
        height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.3s ease;
    }

    .awards-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Award Card */
    .award-card {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 183, 77, 0.1));
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 24px;
      padding: 60px 80px;
      text-align: center;
      max-width: 700px;
      display: none;
      animation: awardEnter 0.8s ease-out forwards;
    }

    .award-card.show {
      display: block;
    }

    .award-card.media-award.show {
      display: flex;
    }

    @keyframes awardEnter {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(50px);
      }
      60% {
        transform: scale(1.05) translateY(-10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .award-card .award-title {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    .award-card .award-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .award-card .award-number {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      color: #1a1a2e;
      font-size: 64px;
      font-weight: 800;
      padding: 10px 40px;
      border-radius: 16px;
      margin-bottom: 20px;
      text-shadow: none;
    }

    .award-card .award-name {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3);
    }

    .award-card .award-preview {
        font-size: 20px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .award-card .award-preview img,
    .award-card .award-preview video {
      max-width: 300px;
      max-height: 200px;
      border-radius: 12px;
      margin-top: 15px;
    }

    /* Media Award Card - side by side layout */
    .award-card.media-award {
      align-items: center;
      gap: 60px;
      padding: 50px 60px;
      max-width: 1100px;
    }

    .award-card.media-award .award-info {
      text-align: center;
      flex-shrink: 0;
    }

    .award-card.media-award .award-media {
      flex-shrink: 0;
    }

    .award-card.media-award .award-media img,
    .award-card.media-award .award-media video {
      max-width: 550px;
      max-height: 450px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    /* Lottery Section */
    .lottery-section {
      text-align: center;
      display: none;
    }

    .lottery-section.show {
      display: block;
    }

    .lottery-title {
      font-size: 48px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 40px;
      text-shadow: 0 2px 20px rgba(255, 215, 0, 0.5);
    }

    .lottery-display {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 24px;
      padding: 60px 100px;
      margin-bottom: 40px;
      min-width: 400px;
    }

    .lottery-number {
      font-size: 120px;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
      font-family: 'Courier New', monospace;
      transition: all 0.1s ease;
    }

    .lottery-number.rolling {
      animation: numberRoll 0.1s infinite;
    }

    @keyframes numberRoll {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .lottery-name {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .lottery-name.show {
      opacity: 1;
    }

    .lottery-blessing {
        font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 15px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .lottery-blessing.show {
      opacity: 1;
    }

    .lottery-blessing img,
    .lottery-blessing video {
      max-width: 250px;
      max-height: 180px;
      border-radius: 12px;
      margin-top: 10px;
    }

    // ============================================
    // Display Tracking

    // Update display timestamps for a blessing
    async function updateDisplayTimestamps(blessingId, isFirstDisplay) {
      const now = Date.now();
      const updates = {
        displayed: true,
        lastDisplayedAt: now
      };
      
      // Only set firstDisplayedAt on first display
      if (isFirstDisplay) {
        updates.firstDisplayedAt = now;

      try {
        await update(ref(db, `blessings/${blessingId}`), updates);

        console.warn('[Display] Failed to update display timestamps:', err);
      }

    // Track lane usage for danmaku
    let laneLastUsed = Array(DANMAKU_LANES).fill(0);

    // ============================================
    // LRU Cache Implementation (Memory Management)
    // ============================================
    const MAX_IMAGE_CACHE_SIZE = 100; // Max cached images
    const MAX_VIDEO_CACHE_SIZE = 20; // Max cached videos (videos are memory-heavy)
    const MAX_BLESSINGS_STORED = 200; // Max blessings to keep for recycling

    class LRUCache {
      constructor(maxSize, onEvict = null) {
        this.maxSize = maxSize;
        this.cache = new Map();
        this.onEvict = onEvict; // Callback when item is evicted
      }

      has(key) {
        return this.cache.has(key);
      }

      get(key) {
        if (!this.cache.has(key)) return undefined;
        // Move to end (most recently used)
        const value = this.cache.get(key);
        this.cache.delete(key);
        this.cache.set(key, value);
        return value;
      }

      set(key, value) {
        // If key exists, delete it first to update position
        if (this.cache.has(key)) {
          this.cache.delete(key);
        }
        // Evict oldest if at capacity
        while (this.cache.size >= this.maxSize) {
          const oldestKey = this.cache.keys().next().value;
          const oldestValue = this.cache.get(oldestKey);
          this.cache.delete(oldestKey);
          // Call eviction callback for cleanup
          if (this.onEvict) {
            this.onEvict(oldestKey, oldestValue);
          }
        }
        this.cache.set(key, value);
      }

      delete(key) {
        if (this.cache.has(key)) {
          const value = this.cache.get(key);
          this.cache.delete(key);
          if (this.onEvict) {
            this.onEvict(key, value);
          }
        }
      }

      get size() {
        return this.cache.size;
      }

      clear() {
        // Evict all items properly
        for (const [key, value] of this.cache) {
          if (this.onEvict) {
            this.onEvict(key, value);
          }
        }
        this.cache.clear();
      }
    }

    // Cleanup function for video elements
    function cleanupVideoElement(url, videoData) {
      if (videoData && videoData.element) {

        video.load(); // Reset the video element
        console.log(`[Memory] Evicted video from cache: ${url.substring(0, 50)}...`);
      }
    }

    function cleanupImageElement(url, img) {

    function isVideo(filename) {

    function createBgMediaElement(filename, containerWidth, containerHeight) {
      return new Promise((resolve) => {
        const path = `./background/${filename}`;
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-media-wrapper';
        
        // Available space (90% of container)
        const maxWidth = containerWidth * 0.9;
        const maxHeight = containerHeight * 0.9;
        
        if (isVideo(filename)) {
          const video = document.createElement('video');
          video.src = path;
          video.className = 'bg-half-media';
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.autoplay = true;
          
          video.addEventListener('loadedmetadata', () => {
            const naturalWidth = video.videoWidth || 1920;
            const naturalHeight = video.videoHeight || 1080;
            const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight);
            wrapper.style.width = (naturalWidth * scale) + 'px';
            wrapper.style.height = (naturalHeight * scale) + 'px';
            wrapper.appendChild(video);
            resolve(wrapper);
          }, { once: true });
          
          // Fallback if metadata doesn't load
          setTimeout(() => {
            if (!wrapper.contains(video)) {
              wrapper.style.width = maxWidth + 'px';
              wrapper.style.height = maxHeight + 'px';
              wrapper.appendChild(video);
              resolve(wrapper);
            }
          }, 2000);
        } else {
          const img = document.createElement('img');
          img.src = path;
          img.className = 'bg-half-media';
          
          img.addEventListener('load', () => {
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;
            const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight);
            wrapper.style.width = (naturalWidth * scale) + 'px';
            wrapper.style.height = (naturalHeight * scale) + 'px';
            wrapper.appendChild(img);
            resolve(wrapper);
          }, { once: true });
          
          img.addEventListener('error', () => {
            wrapper.style.width = maxWidth + 'px';
            wrapper.style.height = maxHeight + 'px';
            wrapper.appendChild(img);
            resolve(wrapper);
          }, { once: true });
        }
      });
    }
    
    async function updateBgHalf(side) {

    // ============================================
    // DANMAKU (Text Blessings)
    // ============================================
    function getAvailableLane() {
      const now = Date.now();
      const cooldownTime = 2000; // 2 seconds cooldown between same lane
      
      // Find lanes that are available (not used recently), excluding the last used lane
      const availableLanes = [];
      for (let i = 0; i < DANMAKU_LANES; i++) {
        // Always exclude the last used lane to prevent adjacent danmakus in same lane
        if (i === lastUsedLane) continue;
        
        if (now - laneLastUsed[i] > cooldownTime) {
          availableLanes.push(i);
        }
      }
      
      // If we have available lanes (excluding last used), pick a random one
      if (availableLanes.length > 0) {
        const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
        laneLastUsed[lane] = now;
        lastUsedLane = lane;
        return lane;
      }
      
      // All lanes busy (except last used), find the oldest one from non-last lanes
      // We still avoid the last used lane even if all are busy
      let bestLane = -1;
      let oldestTime = Infinity;
      
      for (let i = 0; i < DANMAKU_LANES; i++) {
        // Skip the last used lane
        if (i === lastUsedLane) continue;
        
        if (laneLastUsed[i] < oldestTime) {
          oldestTime = laneLastUsed[i];
          bestLane = i;
        }
      }
      
      // Fallback: if somehow no lane found (shouldn't happen with > 1 lane), use lane 0
      if (bestLane === -1) {
        bestLane = lastUsedLane >= 0 ? (lastUsedLane + 1) % DANMAKU_LANES : 0;
      }
      
      laneLastUsed[bestLane] = now;
      lastUsedLane = bestLane;
      return bestLane;
    }

    function createDanmaku(blessing) {
      // Track this danmaku as active
      activeDanmakuIds.add(blessing.id);
      
      // Update display timestamps in Firebase
      const isFirstDisplay = !blessing.displayed;
      updateDisplayTimestamps(blessing.id, isFirstDisplay);
      blessing.displayed = true; // Mark locally too
      
      const lane = getAvailableLane();
      
      // Calculate available height (container height minus top/bottom padding)
      const containerHeight = danmakuContainer.offsetHeight || (window.innerHeight - 80);
      const topPadding = 50;
      
      // Estimate danmaku height based on current text scale
      const textScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--text-scale')) || 1;
      const estimatedDanmakuHeight = (72 * textScale) + (30 * textScale * 2); // font size + top/bottom padding
      
      // Calculate safe bottom boundary (container height - danmaku height - margin)
      const bottomBoundary = containerHeight - estimatedDanmakuHeight - 20; // 20px safety margin
      const availableHeight = bottomBoundary - topPadding;
      
      // Distribute lanes evenly across available height
      const laneSpacing = availableHeight / Math.max(1, DANMAKU_LANES - 1);
      
      // Calculate top position, clamped to ensure it doesn't exceed bottom boundary
      const topPosition = Math.min(
        topPadding + (lane * laneSpacing),
        bottomBoundary
      );

      const danmaku = document.createElement('div');
      danmaku.className = 'danmaku';
      danmaku.style.top = topPosition + 'px';
      danmaku.style.animationDuration = DANMAKU_DURATION + 'ms';
      danmaku.dataset.id = blessing.id;
      
      // Apply custom color if specified, otherwise use default gradient
      if (blessing.color) {
        // Convert hex to rgba with opacity for Morandi effect
        const hex = blessing.color.replace('#', '');
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        // Create gradient with slight variation for depth
        const r2 = Math.max(0, Math.min(255, r - 20));
        const g2 = Math.max(0, Math.min(255, g - 20));
        const b2 = Math.max(0, Math.min(255, b - 20));
        danmaku.style.background = `linear-gradient(135deg, rgba(${r}, ${g}, ${b}, 0.88), rgba(${r2}, ${g2}, ${b2}, 0.88))`;
      }
      
      danmaku.innerHTML = `
        <span class="sender">${escapeHtml(blessing.name)}</span>
        <span class="message">${escapeHtml(blessing.message)}</span>
      `;

      danmakuContainer.appendChild(danmaku);

      // Create hearts burst
      for (let i = 0; i < 3; i++) {
        setTimeout(createFloatingHeart, i * 150);
      }

      // Remove after animation and clear from active set
      setTimeout(() => {
        danmaku.remove();
        activeDanmakuIds.delete(blessing.id);
      }, DANMAKU_DURATION + 500);
    }

    // Helper to add blessing while maintaining max size
    function addBlessingWithLimit(array, blessing, maxSize) {
      array.push(blessing);
      // Remove oldest entries if exceeding limit
      while (array.length > maxSize) {
        array.shift();
      }
    }

    function showNextDanmaku() {

      }

    // ============================================
    // PHOTO Blessings
    // ============================================
    const photoAnimations = [
      'photoEnterFromRight',
      'photoEnterFromLeft',
      'photoEnterFromTop',
      'photoEnterFromBottom',
      'photoEnterFromTopRight',
      'photoEnterFromTopLeft',
      'photoEnterFromBottomRight',
      'photoEnterFromBottomLeft'
    ];

    // Preload an image, decode it, and cache it
    async function preloadImage(url) {
      if (preloadedImages.has(url)) {
        return preloadedImages.get(url);
      }
      
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = async () => {
          try {
            // Decode the image (decompress pixels) so it's ready to render instantly
            await img.decode();
            preloadedImages.set(url, img);
            resolve(img);
          } catch (e) {
            // decode() failed, but image is still loaded
            preloadedImages.set(url, img);
            resolve(img);
          }
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // Preload a video and cache it with dimensions
    async function preloadVideo(url) {
      if (preloadedVideos.has(url)) {
        return preloadedVideos.get(url);
      }
      
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'auto';
        video.muted = true; // Mute for preloading to avoid autoplay issues
        video.onloadedmetadata = () => {
          // Store video with its dimensions
          const videoData = {
            element: video,
            width: video.videoWidth,
            height: video.videoHeight
          };
          preloadedVideos.set(url, videoData);
          resolve(videoData);
        };
        video.onerror = reject;
        video.src = url;
        video.load(); // Start loading
      });
    }

    // Get next position (alternates left/right)
    function getNextMediaPosition() {
      // Check which positions are currently in use
      const usedPositions = new Set(activeMedia.map(m => m.position));
      
      // If a position is free, use it
      if (!usedPositions.has(0)) return 0;
      if (!usedPositions.has(1)) return 1;
      
      // Both positions in use (shouldn't happen due to MAX check), alternate
      lastMediaPosition = lastMediaPosition === 0 ? 1 : 0;
      return lastMediaPosition;
    }

    // Get centered position based on actual media dimensions
    // Requirements:
    // 1. Show media in left half or right half of the screen
    // 2. Media should be centered in their assigned half
    // 3. Media should not be larger than their assigned half on any side. If they are, make them smaller.
    function getCenteredPosition(position, mediaURL, isVideo = false) {
      const photoScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--photo-scale')) || 1;
      
      // Get natural media dimensions
      let naturalWidth, naturalHeight;
      if (isVideo) {
        const preloadedVideo = preloadedVideos.get(mediaURL);
        if (preloadedVideo) {
          naturalWidth = preloadedVideo.width;
          naturalHeight = preloadedVideo.height;
        } else {
          naturalWidth = 400;
          naturalHeight = 300;
        }
      } else {
        const preloadedImg = preloadedImages.get(mediaURL);
        naturalWidth = preloadedImg ? preloadedImg.naturalWidth : 400;
        naturalHeight = preloadedImg ? preloadedImg.naturalHeight : 300;
      }
      
      const headerHeight = 75;
      const bottomMargin = 75;
      const availableWidth = window.innerWidth;
      const availableHeight = window.innerHeight - headerHeight - bottomMargin;
      const halfWidth = availableWidth / 2;
      const edgePadding = 20 * photoScale;
      const padding = 20 * photoScale;
      const senderHeight = 48 * photoScale;
      
      // Requirement 3: Calculate maximum size that fits in half the screen
      const maxCardWidth = halfWidth - (edgePadding * 2);
      const maxCardHeight = availableHeight - (edgePadding * 2);
      
      // Maximum image size = max card size - card padding - sender height
      const maxImgWidth = maxCardWidth - (padding * 2);
      const maxImgHeight = maxCardHeight - (padding * 2) - senderHeight;
      
      // Calculate scale to fit image within max size (maintaining aspect ratio)
      const scaleW = maxImgWidth / naturalWidth;
      const scaleH = maxImgHeight / naturalHeight;
      const imgScale = Math.min(scaleW, scaleH);
      
      // Calculate final image dimensions
      const actualImgWidth = naturalWidth * imgScale;
      const actualImgHeight = naturalHeight * imgScale;
      
      // Calculate card dimensions
      const cardWidth = actualImgWidth + padding * 2;
      const cardHeight = actualImgHeight + padding * 2 + senderHeight;
      
      // Requirement 1 & 2: Center media in assigned half
      let x;
      if (position === 0) {
        // Left half: center at 25% of screen width
        const leftHalfCenter = halfWidth * 0.5;
        x = leftHalfCenter - cardWidth / 2;
        } else {
        // Right half: center at 75% of screen width
        const rightHalfCenter = halfWidth + (halfWidth * 0.5);
        x = rightHalfCenter - cardWidth / 2;
      }
      
      // Center vertically
      let y = headerHeight + (availableHeight - cardHeight) / 2;
      const randomY = (Math.random() - 0.5) * 30;
      y += randomY;
      
      return {
        x: x,
        y: Math.max(headerHeight + 10, Math.min(y, window.innerHeight - bottomMargin - cardHeight)),
        actualImgWidth: actualImgWidth,
        actualImgHeight: actualImgHeight
      };
    }

    async function createMediaCard(blessing) {
      if (activeMedia.length >= MAX_MEDIA_ON_SCREEN) {
        return false;
      }

      // Update display timestamps in Firebase
      const isFirstDisplay = !blessing.displayed;
      updateDisplayTimestamps(blessing.id, isFirstDisplay);
      blessing.displayed = true; // Mark locally too

      const isPhoto = blessing.photoURL !== undefined;
      const isVideo = blessing.videoURL !== undefined;

      // Preload media first
      try {
        if (isPhoto) {
          await preloadImage(blessing.photoURL);
        } else if (isVideo) {
          await preloadVideo(blessing.videoURL);
        }
      } catch (e) {
        console.warn('Failed to preload media:', e);
        return false;
      }

      // Get the next position (alternates left/right)
      const position = getNextMediaPosition();
      lastMediaPosition = position; // Track for alternation
      
      const pos = isPhoto 
        ? getCenteredPosition(position, blessing.photoURL, false)
        : getCenteredPosition(position, blessing.videoURL, true); // Use actual video dimensions
      const animation = photoAnimations[Math.floor(Math.random() * photoAnimations.length)];

      // Get calculated dimensions from position
      const calculatedWidth = pos.actualImgWidth || (window.innerWidth * 0.45);
      const calculatedHeight = pos.actualImgHeight || (window.innerHeight * 0.45);

      // Get current photo scale for card dimensions
      const photoScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--photo-scale')) || 1;
      const padding = 20 * photoScale;
      const senderHeight = 48 * photoScale;
      const cardWidth = calculatedWidth + padding * 2;
      const cardHeight = calculatedHeight + padding * 2 + senderHeight;

      const card = document.createElement('div');
      card.className = 'photo-card';
      // Set explicit dimensions to match calculations
      card.style.width = cardWidth + 'px';
      card.style.height = cardHeight + 'px';
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';
      card.style.animation = `${animation} 1.5s ease-out forwards`;
      card.dataset.id = blessing.id;
      
      const senderDiv = document.createElement('div');
      senderDiv.className = 'photo-sender';
      senderDiv.textContent = `來自 ${blessing.name}`;
      
      // Create media container to constrain dimensions
      const mediaContainer = document.createElement('div');
      mediaContainer.style.width = calculatedWidth + 'px';
      mediaContainer.style.height = calculatedHeight + 'px';
      mediaContainer.style.maxWidth = calculatedWidth + 'px';
      mediaContainer.style.maxHeight = calculatedHeight + 'px';
      mediaContainer.style.overflow = 'hidden';
      mediaContainer.style.position = 'relative';
      mediaContainer.style.borderRadius = 'inherit';
      
      // Create image or video element
      if (isPhoto) {
        const imgElement = new Image();
        imgElement.src = blessing.photoURL;
        imgElement.alt = 'Photo';
        
        try {
          await imgElement.decode();
        } catch (e) {
          // Continue even if decode fails
        }
        
        imgElement.style.width = '100%';
        imgElement.style.height = '100%';
        imgElement.style.objectFit = 'contain';
        
        mediaContainer.appendChild(imgElement);
        card.appendChild(mediaContainer);
      } else if (isVideo) {
        const videoElement = document.createElement('video');
        videoElement.src = blessing.videoURL;
        videoElement.controls = false;
        videoElement.autoplay = true;
        videoElement.loop = true;
        videoElement.muted = true;
        videoElement.playsInline = true;
        
        videoElement.style.width = '100%';
        videoElement.style.height = '100%';
        videoElement.style.objectFit = 'contain';
        videoElement.style.display = 'block';
        
        mediaContainer.appendChild(videoElement);
        card.appendChild(mediaContainer);
      }
      
      card.appendChild(senderDiv);

      photoContainer.appendChild(card);
      activeMedia.push({ id: blessing.id, element: card, position: position, type: isPhoto ? 'photo' : 'video' });

      // Create hearts burst
        for (let i = 0; i < 5; i++) {
        setTimeout(createFloatingHeart, i * 100);
      }

      // After entrance animation ends, preserve rotation but clear translation
      // Store the animation name to extract the final rotation
      const rotationMap = {
        'photoEnterFromRight': 'rotate(-2deg)',
        'photoEnterFromLeft': 'rotate(2deg)',
        'photoEnterFromTop': 'rotate(-3deg)',
        'photoEnterFromBottom': 'rotate(3deg)',
        'photoEnterFromTopRight': 'rotate(-2deg)',
        'photoEnterFromTopLeft': 'rotate(2deg)',
        'photoEnterFromBottomRight': 'rotate(3deg)',
        'photoEnterFromBottomLeft': 'rotate(-3deg)'
      };
      const finalRotation = rotationMap[animation] || 'rotate(0deg)';
      
      card.addEventListener('animationend', () => {
        // Apply only rotation, no translation (positioning is handled by left/top)
        card.style.transform = finalRotation;
        card.style.animation = 'none';
      }, { once: true });

      // Remove after display time
      setTimeout(() => {
        // Pause video if it's a video
        if (isVideo) {
          const videoElement = card.querySelector('video');
          if (videoElement) {
            videoElement.pause();
          }
        }
        
        // Update background on the corresponding side when card exits
        onMediaCardExit(position);
        
        // Apply scale for fade-out, preserving existing rotation
        const currentTransform = card.style.transform || 'rotate(0deg)';
        card.style.transform = currentTransform + ' scale(0.85)';
        card.classList.add('fade-out');
        setTimeout(() => {
          card.remove();
          activeMedia = activeMedia.filter(m => m.id !== blessing.id);
        }, 500);
      }, MEDIA_DISPLAY_TIME);
      
      return true;
    }

    async function showNextMedia() {
      if (!isPlaying) return;
      if (activeMedia.length >= MAX_MEDIA_ON_SCREEN) return;

      // Get IDs of currently displayed media
      const activeMediaIds = new Set(activeMedia.map(m => m.id));

      if (mediaQueue.length > 0) {
        const blessing = mediaQueue.shift();
        addBlessingWithLimit(mediaBlessings, blessing, MAX_BLESSINGS_STORED);
        
        // Preload next in queue while showing this one
        if (mediaQueue.length > 0) {
          const nextBlessing = mediaQueue[0];

        // Recycle - but avoid duplicates on screen
        const availableMedia = mediaBlessings.filter(b => !activeMediaIds.has(b.id));

    // ============================================

    const blessingsRef = ref(db, 'blessings');

    onChildAdded(blessingsRef, (snapshot) => {
      const blessing = { id: snapshot.key, ...snapshot.val() };
      
      // Skip private blessings
      if (blessing.private === true) return;

      // Separate by type
      if ((blessing.type === 'photo' && blessing.photoURL) || (blessing.type === 'video' && blessing.videoURL)) {
        // Check if already exists
        if (!mediaBlessings.some(b => b.id === blessing.id) && 
            !mediaQueue.some(b => b.id === blessing.id)) {
          // Preload media immediately
          if (blessing.photoURL) {
            preloadImage(blessing.photoURL).catch(() => {});
          } else if (blessing.videoURL) {
            preloadVideo(blessing.videoURL).catch(() => {});
          }
          
          // If already displayed, put in recycle pool; otherwise put in queue
          if (blessing.displayed) {
            addBlessingWithLimit(mediaBlessings, blessing, MAX_BLESSINGS_STORED);
          } else {
            mediaQueue.push(blessing);
          }
          photoCountEl.textContent = mediaBlessings.length + mediaQueue.length;

      } else if (blessing.message) {
        // Check if already exists
        if (!textBlessings.some(b => b.id === blessing.id) &&
            !textQueue.some(b => b.id === blessing.id)) {
          // If already displayed, put in recycle pool; otherwise put in queue
          if (blessing.displayed) {
            addBlessingWithLimit(textBlessings, blessing, MAX_BLESSINGS_STORED);
          } else {
            textQueue.push(blessing);
          }
          textCountEl.textContent = textBlessings.length + textQueue.length;
        }
      }

      // Hide waiting screen if we have content
      if (textQueue.length > 0 || mediaQueue.length > 0 || 
          textBlessings.length > 0 || mediaBlessings.length > 0) {
        waitingScreen.classList.add('hidden');
      }
    });

      const deletedId = snapshot.key;
      
      // Remove from text
      textQueue = textQueue.filter(b => b.id !== deletedId);
      textBlessings = textBlessings.filter(b => b.id !== deletedId);
      
      // Remove from media
      mediaQueue = mediaQueue.filter(b => b.id !== deletedId);
      mediaBlessings = mediaBlessings.filter(b => b.id !== deletedId);
      
      // Remove active media if displayed
      const activeMediaItem = activeMedia.find(m => m.id === deletedId);
      if (activeMediaItem) {
        activeMediaItem.element.remove();
        activeMedia = activeMedia.filter(m => m.id !== deletedId);
      }

      // Update counts
      textCountEl.textContent = textBlessings.length + textQueue.length;
      photoCountEl.textContent = mediaBlessings.length + mediaQueue.length;

      // Show waiting if empty
      if (textBlessings.length === 0 && mediaBlessings.length === 0 && 
          textQueue.length === 0 && mediaQueue.length === 0) {
        waitingScreen.classList.remove('hidden');
      }
    });

    // ============================================
    // Emoji Blast Feature - Tornado/Fountain Effect
    // ============================================
    function createEmojiFountain(emoji, originX, senderName) {
      const blastCount = 18 + Math.floor(Math.random() * 8); // 18-25 emojis per blast
      const duration = 2500; // Animation duration in ms
      
      // Create sender name tag at the bottom of the fountain
      if (senderName) {
        const senderTag = document.createElement('div');
        senderTag.className = 'emoji-blast-sender';
        senderTag.textContent = senderName;
        senderTag.style.left = originX + 'px';
        emojiBlastContainer.appendChild(senderTag);
        
        // Remove after animation
        setTimeout(() => senderTag.remove(), 3000);
      }
      
      for (let i = 0; i < blastCount; i++) {
        // Stagger emoji creation for burst effect
        setTimeout(() => {
          const blast = document.createElement('div');
          blast.className = 'emoji-blast';
          blast.textContent = emoji;
          
          // Start from origin point
          blast.style.left = originX + 'px';
          blast.style.bottom = '0px';
          
          // Random spread angle for tornado shape (-15 to +15 degrees from vertical)
          const spreadAngle = (Math.random() - 0.5) * 30;
          const spreadRadians = spreadAngle * (Math.PI / 180);
          
          // Random height (300-500px)
          const maxHeight = 300 + Math.random() * 200;
          
          // Calculate final horizontal offset based on spread angle
          // Wider spread at the top for tornado shape
          const horizontalSpread = Math.tan(spreadRadians) * maxHeight;
          
          // Starting scale and ending scale (grows as it rises)
          const startScale = 0.6 + Math.random() * 0.3;
          const endScale = 1.2 + Math.random() * 0.4;
          
          // Random rotation
          const rotation = (Math.random() - 0.5) * 60;
          
          // Random slight delay for more organic feel
          const animDelay = Math.random() * 100;
          
          emojiBlastContainer.appendChild(blast);
          
          // Use Web Animations API for smooth curved path
          const keyframes = [
            { 
              transform: `translate(0, 0) scale(${startScale}) rotate(0deg)`,
              opacity: 0
            },
            { 
              transform: `translate(${horizontalSpread * 0.2}px, -${maxHeight * 0.15}px) scale(${startScale + (endScale - startScale) * 0.2}) rotate(${rotation * 0.3}deg)`,
              opacity: 1,
              offset: 0.15
            },
            { 
              transform: `translate(${horizontalSpread * 0.5}px, -${maxHeight * 0.5}px) scale(${startScale + (endScale - startScale) * 0.5}) rotate(${rotation * 0.6}deg)`,
              opacity: 0.5,
              offset: 0.5
            },
            { 
              transform: `translate(${horizontalSpread * 0.8}px, -${maxHeight * 0.8}px) scale(${startScale + (endScale - startScale) * 0.8}) rotate(${rotation * 0.9}deg)`,
              opacity: 0.3,
              offset: 0.8
            },
            { 
              transform: `translate(${horizontalSpread}px, -${maxHeight}px) scale(${endScale}) rotate(${rotation}deg)`,
              opacity: 0
            }
          ];
          
          const animation = blast.animate(keyframes, {
            duration: duration + Math.random() * 500,
            delay: animDelay,
            easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
            fill: 'forwards'
          });
          
          animation.onfinish = () => blast.remove();
          
        }, i * 20); // Stagger by 20ms each for denser burst
      }
    }

    // ============================================
    // Emoji Blast Queue System
    // ============================================
    const MAX_CONCURRENT_BLASTS = 3;
    const BLAST_DELAY = 1000; // Delay between starting each blast (ms)
    const BLAST_DURATION = 3000; // How long a blast animation lasts
    const MAX_QUEUE_LENGTH = 200; // Limit queue for edge cases
    
    let emojiBlastQueue = [];
    let activeBlastsCount = 0;
    let lastBlastTime = 0;

    // Try to display next blast from queue
    function tryDisplayNextBlast() {
      if (emojiBlastQueue.length === 0) return;
      if (activeBlastsCount >= MAX_CONCURRENT_BLASTS) return;
      
      // Ensure minimum delay between blasts for visual sequencing
      const now = Date.now();
      const timeSinceLastBlast = now - lastBlastTime;
      
      if (timeSinceLastBlast < BLAST_DELAY) {
        // Schedule to try again after the remaining delay
        setTimeout(tryDisplayNextBlast, BLAST_DELAY - timeSinceLastBlast);
        return;
      }
      
      // Display the next blast
      const blastItem = emojiBlastQueue.shift();
      if (blastItem) {
        displayEmojiBlast(blastItem.emoji, blastItem.key, blastItem.senderName);
        lastBlastTime = Date.now();
        
        // Immediately try to display more if we have capacity
        if (emojiBlastQueue.length > 0 && activeBlastsCount < MAX_CONCURRENT_BLASTS) {
          setTimeout(tryDisplayNextBlast, BLAST_DELAY);
        }
      }
    }

    // Display a single emoji blast and delete from Firebase
    function displayEmojiBlast(emoji, key, senderName) {
      activeBlastsCount++;
      
      // Random origin point at the bottom of the screen
      const originX = 100 + Math.random() * (window.innerWidth - 200);
      createEmojiFountain(emoji, originX, senderName);
      
      // Delete from Firebase after triggering animation
      remove(ref(db, `emojiBlasts/${key}`)).catch(err => {
        console.log('Could not delete emoji blast:', err);
      });
      
      // When this blast finishes, reduce count and try to display next
      setTimeout(() => {
        activeBlastsCount = Math.max(0, activeBlastsCount - 1);
        // Immediately try to display next from queue
        tryDisplayNextBlast();
      }, BLAST_DURATION);
    }

    // Listen for emoji blast events
    const emojiBlastsRef = ref(db, 'emojiBlasts');
    onChildAdded(emojiBlastsRef, (snapshot) => {
      const blastData = snapshot.val();
      const emoji = blastData?.e;
      const senderName = blastData?.n; // Sender name from submission
      if (emoji) {
        // Add to queue if not exceeding max length
        if (emojiBlastQueue.length < MAX_QUEUE_LENGTH) {
          emojiBlastQueue.push({
            emoji: emoji,
            key: snapshot.key,
            senderName: senderName
          });
          
          // Try to display immediately
          tryDisplayNextBlast();
        } else {
          // Queue full, delete immediately
          remove(ref(db, `emojiBlasts/${snapshot.key}`)).catch(() => {});
        }
      }
    });

        stats.jsHeapTotal = Math.round(performance.memory.totalJSHeapSize / 1024 / 1024 * 10) / 10; // MB

      }

        }, 100);
      } else if (step === 'choiceReveal') {
        // Show choice reveal with visual effects
        updateNextButton(false);
        
        setTimeout(() => {
          choiceRevealSection.classList.add('show');
          triggerConfetti();
        }, 100);
      } else if (step === 'summary') {
        // Show summary of bride and groom's choice only
        updateNextButton(true);
        
        setTimeout(() => {
          let summaryHTML = '';
          
          // Only add chosen awards (no lottery winners)
          const chosenLabels = {
            bridegroomText: '🤵 新郎精選文字',
            bridegroomMedia: '🤵 新郎精選媒體',
            brideText: '👰 新娘精選文字',
            brideMedia: '👰 新娘精選媒體'
          };
          
          ['bridegroomText', 'bridegroomMedia', 'brideText', 'brideMedia'].forEach(key => {
            const awardId = awardsData[key];
            if (awardId) {
              const blessing = [...textBlessings, ...mediaBlessings, ...textQueue, ...mediaQueue].find(b => b.id === awardId);
              if (blessing) {
                summaryHTML += `
                  <div class="awards-summary-item">
                    <div class="item-label">${chosenLabels[key]}</div>
                    <div class="item-number">${blessing.guestNumber || '-'}</div>
                    <div class="item-name">${escapeHtml(blessing.name)}</div>
                  </div>
                `;
              }
            }
          });
          
          awardsSummaryList.innerHTML = summaryHTML;
          awardsSummary.classList.add('show');
          triggerConfetti();
        }, 100);
      } else if (step.startsWith('lottery')) {
        // Show lottery
        const lotteryIndex = parseInt(step.replace('lottery', '')) - 1;
        const lotteryLabels = ['第一位', '第二位', '第三位', '第四位', '第五位'];
        
        setTimeout(() => {
          lotterySection.classList.add('show');
          lotteryNumber.textContent = '?';
          lotteryNumber.classList.remove('rolling');
          lotteryNameEl.textContent = '';
          lotteryNameEl.classList.remove('show');
          lotteryBlessing.innerHTML = '';
          lotteryBlessing.classList.remove('show');
          lotteryMedia.innerHTML = '';
          lotteryDisplay.classList.remove('has-media');
          
          // Check if this lottery has already been drawn
          if (lotteryWinners[lotteryIndex]) {
            // Already drawn, show result
            const winner = lotteryWinners[lotteryIndex];
            lotteryNumber.textContent = winner.guestNumber || '-';
            lotteryNameEl.textContent = winner.name;
            lotteryNameEl.classList.add('show');
            
            // Show blessing content - use side-by-side for media
            const hasMedia = winner.photoURL || winner.videoURL;
            if (hasMedia) {
              lotteryDisplay.classList.add('has-media');
              if (winner.photoURL) {
                lotteryMedia.innerHTML = `<img src="${winner.photoURL}" alt="Photo">`;
              } else {
                lotteryMedia.innerHTML = `<video src="${winner.videoURL}" controls autoplay muted></video>`;
              }
            } else if (winner.message) {
              lotteryBlessing.innerHTML = escapeHtml(winner.message);
              lotteryBlessing.classList.add('show');
            }
            
            // Hide the button after drawn, enable next
            lotteryBtn.style.display = 'none';
            updateNextButton(index === awardSteps.length - 1);
          } else {
            // Not drawn yet, disable next button
            lotteryBtn.style.display = '';
            lotteryBtn.disabled = false;
            lotteryBtn.textContent = `抽出${lotteryLabels[lotteryIndex]}`;
            awardsNextBtn.disabled = true;
            awardsNextBtn.innerHTML = '下一步 <span class="material-symbols-outlined">arrow_forward</span>';
          }
        }, 100);
      } else {
        // Show award card - enable next button for non-lottery steps
        updateNextButton(index === awardSteps.length - 1);
        
        const awardId = awardsData[step];
        // Search in all blessing arrays
        let blessing = [...textBlessings, ...mediaBlessings, ...textQueue, ...mediaQueue].find(b => b.id === awardId);
        
        // If not found locally, fetch from Firebase
        if (!blessing && awardId) {
          get(ref(db, `blessings/${awardId}`)).then(snapshot => {
            if (snapshot.exists()) {
              const fetchedBlessing = { id: awardId, ...snapshot.val() };
              displayAwardCard(step, fetchedBlessing);
            }
          }).catch(err => console.error('Error fetching blessing:', err));
          return;
        }
        
        if (blessing) {
          displayAwardCard(step, blessing);
        }
      }
    }
    
    function displayAwardCard(step, blessing) {
      // Set title based on step
      const titles = {
        bridegroomText: '🤵 新郎精選 - 文字祝福',
        bridegroomMedia: '🤵 新郎精選 - 照片/影片',
        brideText: '👰 新娘精選 - 文字祝福',
        brideMedia: '👰 新娘精選 - 照片/影片'
      };
      
      const isMedia = blessing.photoURL || blessing.videoURL;
      
      // Use different layout for media vs text
      if (isMedia) {
        awardCard.classList.add('media-award');
        awardCard.innerHTML = `
          <div class="award-info">
            <div class="award-title">${titles[step] || '得獎者'}</div>
            <div class="award-icon">🏆</div>
            <div class="award-number">${blessing.guestNumber || '-'}</div>
            <div class="award-name">${escapeHtml(blessing.name)}</div>
          </div>
          <div class="award-media">
            ${blessing.photoURL 
              ? `<img src="${blessing.photoURL}" alt="Photo">`
              : `<video src="${blessing.videoURL}" loop autoplay muted></video>`
            }
          </div>
        `;
      } else {
        awardCard.classList.remove('media-award');
        awardCard.innerHTML = `
          <div class="award-title">${titles[step] || '得獎者'}</div>
          <div class="award-icon">🏆</div>
          <div class="award-number">${blessing.guestNumber || '-'}</div>
          <div class="award-name">${escapeHtml(blessing.name)}</div>
          <div class="award-preview">${blessing.message ? escapeHtml(blessing.message) : ''}</div>
        `;
      }
      
      setTimeout(() => {
        awardCard.classList.add('show');
        triggerConfetti();
      }, 100);
    }

    // Lottery functionality
    lotteryBtn.addEventListener('click', () => {
      if (isLotteryRolling) return;
      
      // Get all eligible blessings (non-hidden, not already an award, not already a lottery winner)
      const excludeIds = [
        awardsData.bridegroomText,
        awardsData.bridegroomMedia,
        awardsData.brideText,
        awardsData.brideMedia,
        ...lotteryWinners.map(w => w.id)
      ].filter(Boolean);
      
      const allEligible = [...textBlessings, ...mediaBlessings].filter(b => 
        !b.private && !excludeIds.includes(b.id) && b.guestNumber
      );
      
      if (allEligible.length === 0) {
        showToast('沒有符合資格的祝福可以抽獎！', 'warning');
        return;
      }
      
      isLotteryRolling = true;
      lotteryBtn.disabled = true;
      lotteryBtn.textContent = '抽獎中...';
      lotteryNumber.classList.add('rolling');
      lotteryNameEl.classList.remove('show');
      lotteryBlessing.classList.remove('show');
      lotteryBlessing.innerHTML = '';
      
      // Rolling animation
      let rollCount = 0;
      const maxRolls = 30;
      const rollInterval = setInterval(() => {
        const randomBlessing = allEligible[Math.floor(Math.random() * allEligible.length)];
        lotteryNumber.textContent = randomBlessing.guestNumber;
        rollCount++;
        
        if (rollCount >= maxRolls) {
          clearInterval(rollInterval);
          
          // Final selection
          const winner = allEligible[Math.floor(Math.random() * allEligible.length)];
          lotteryWinners.push(winner);
          
          lotteryNumber.classList.remove('rolling');
          lotteryNumber.textContent = winner.guestNumber || '-';
          
          setTimeout(() => {
            lotteryNameEl.textContent = winner.name;
            lotteryNameEl.classList.add('show');
            
            // Show blessing content - use side-by-side for media
            const hasMedia = winner.photoURL || winner.videoURL;
            if (hasMedia) {
              lotteryDisplay.classList.add('has-media');
              lotteryBlessing.innerHTML = '';
              if (winner.photoURL) {
                lotteryMedia.innerHTML = `<img src="${winner.photoURL}" alt="Photo">`;
              } else {
                lotteryMedia.innerHTML = `<video src="${winner.videoURL}" controls autoplay muted></video>`;
              }
            } else if (winner.message) {
              lotteryDisplay.classList.remove('has-media');
              lotteryMedia.innerHTML = '';
              lotteryBlessing.innerHTML = escapeHtml(winner.message);
              lotteryBlessing.classList.add('show');
            }
            
            triggerConfetti();
            
            isLotteryRolling = false;
            // Hide the button after drawn
            lotteryBtn.style.display = 'none';
            // Enable next button after drawing
            updateNextButton(currentAwardIndex === awardSteps.length - 1);
          }, 500);
        }
      }, 100);
    });

    // Confetti effect
    function triggerConfetti() {
      const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#ff9ff3', '#54a0ff'];
      
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
          confetti.style.animationDelay = (Math.random() * 0.5) + 's';
          
          // Random shapes
          if (Math.random() > 0.5) {
            confetti.style.borderRadius = '50%';
          } else {
            confetti.style.width = '8px';
            confetti.style.height = '16px';
          }
          
          confettiContainer.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 4000);
        }, i * 20);
      }
    }

    // Helper to get all blessings for lottery (need to combine queues and pools)
    function getAllBlessingsForLottery() {
      const all = [];
      const seenIds = new Set();
      
      [...textBlessings, ...mediaBlessings, ...textQueue, ...mediaQueue].forEach(b => {
        if (!seenIds.has(b.id)) {
          seenIds.add(b.id);
          all.push(b);
        }
      });
      
      return all;
    }
  </script>
</body>
