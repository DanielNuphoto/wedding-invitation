<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>祝福牆 | 顏朱府囍宴</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #2d2424 0%, #3d3030 50%, #2a2020 100%);
      font-family: 'Wix Madefor Text', 'Noto Sans TC', sans-serif;
      color: #fff;
    }

    /* Decorative background elements */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(179, 144, 144, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(179, 144, 144, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.03) 0%, transparent 30%);
      animation: bgFloat 30s ease-in-out infinite;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 40px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(45, 36, 36, 0.9) 0%, transparent 100%);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .header .stats {
      display: flex;
      gap: 30px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }

    .header .stats span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .stats .count {
      font-weight: 700;
      font-size: 20px;
      color: #e8c4c4;
    }

    /* Waiting screen */
    .waiting-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.5s ease;
    }

    .waiting-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .waiting-screen .icon {
      font-size: 80px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }

    .waiting-screen .text {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.5);
    }

    .waiting-screen .subtext {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }

    /* QR Code section */
    .qr-section {
      position: fixed;
      bottom: 40px;
      right: 40px;
      text-align: center;
      z-index: 100;
    }

    .qr-section .qr-box {
      width: 150px;
      height: 150px;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
    }

    .qr-section .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-section .qr-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Blessing display area */
    .blessing-display {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 120px 200px 40px 40px;
    }

    /* Blessing card */
    .blessing-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 50px;
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: scale(0.9) translateY(30px);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .blessing-card.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .blessing-card.hide {
      opacity: 0;
      transform: scale(0.9) translateY(-30px);
    }

    .blessing-card .sender {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .blessing-card .avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #b39090, #958282);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      color: #fff;
      font-weight: 600;
      flex-shrink: 0;
    }

    .blessing-card .sender-info h3 {
      font-size: 24px;
      font-weight: 600;
      color: #4a3a3a;
      margin: 0 0 5px 0;
    }

    .blessing-card .sender-info .time {
      font-size: 14px;
      color: #9a8a8a;
    }

    .blessing-card .message {
      font-size: 28px;
      line-height: 1.6;
      color: #3a2a2a;
      margin-bottom: 20px;
      word-wrap: break-word;
    }

    .blessing-card .photo {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 16px;
      margin-top: 20px;
    }

    /* Photo-only card variant */
    .blessing-card.photo-only {
      padding: 30px;
    }

    .blessing-card.photo-only .photo {
      max-height: 500px;
      margin-top: 0;
    }

    /* Controls (for host) */
    .controls {
      position: fixed;
      bottom: 40px;
      left: 40px;
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .control-btn .material-symbols-outlined {
      font-size: 24px;
    }

    /* Floating hearts animation */
    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      animation: floatUp 8s ease-out forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .blessing-display {
        padding: 100px 20px 180px 20px;
      }

      .qr-section {
        bottom: 20px;
        right: 50%;
        transform: translateX(50%);
      }

      .qr-section .qr-box {
        width: 100px;
        height: 100px;
      }

      .blessing-card {
        padding: 30px;
      }

      .blessing-card .message {
        font-size: 22px;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 20px;
      }

      .header .stats {
        gap: 15px;
        font-size: 14px;
      }

      .blessing-card .sender .avatar {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .blessing-card .sender-info h3 {
        font-size: 20px;
      }

      .blessing-card .message {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>

  <header class="header">
    <h1>💕 祝福牆</h1>
    <div class="stats">
      <span>
        <span class="material-symbols-outlined">favorite</span>
        收到 <span class="count" id="totalCount">0</span> 則祝福
      </span>
    </div>
  </header>

  <div class="waiting-screen" id="waitingScreen">
    <div class="material-symbols-outlined icon">hourglass_empty</div>
    <div class="text">等待祝福中...</div>
    <div class="subtext">掃描 QR Code 送上您的祝福</div>
  </div>

  <div class="blessing-display">
    <div class="blessing-card" id="blessingCard">
      <div class="sender">
        <div class="avatar" id="avatar">王</div>
        <div class="sender-info">
          <h3 id="senderName">王小明</h3>
          <div class="time" id="sendTime">剛剛</div>
        </div>
      </div>
      <div class="message" id="message">祝福新人永浴愛河，百年好合！</div>
      <img class="photo" id="photo" src="" alt="" style="display: none;">
    </div>
  </div>

  <div class="hearts-container" id="heartsContainer"></div>

  <div class="qr-section">
    <div class="qr-box">
      <!-- TODO: Replace with your actual QR code image -->
      <!-- You can generate one at: https://www.qr-code-generator.com/ -->
      <!-- Link it to: https://YOUR_GITHUB_USERNAME.github.io/wedding-invitation/bless/ -->
      <img id="qrCode" src="./qr.png" alt="QR Code">
    </div>
    <div class="qr-text">掃描送祝福</div>
  </div>

  <div class="controls">
    <button class="control-btn" id="pauseBtn" title="暫停/播放">
      <span class="material-symbols-outlined" id="pauseIcon">pause</span>
    </button>
    <button class="control-btn" id="skipBtn" title="下一則">
      <span class="material-symbols-outlined">skip_next</span>
    </button>
    <button class="control-btn" id="fullscreenBtn" title="全螢幕">
      <span class="material-symbols-outlined">fullscreen</span>
    </button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // ============================================
    // 🔥 Firebase Configuration
    // TODO: Replace with your Firebase project config
    // ============================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getDatabase, ref, onValue, onChildAdded, onChildRemoved, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDD-klcHuiIXBY9f4rjuDR-7aDyKrXICv0",
        authDomain: "wedding-e335c.firebaseapp.com",
        databaseURL: "https://wedding-e335c-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wedding-e335c",
        storageBucket: "wedding-e335c.firebasestorage.app",
        messagingSenderId: "89341612270",
        appId: "1:89341612270:web:afa62ef0c5b51f5130a3ff"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ============================================
    // State
    // ============================================
    let blessingQueue = [];
    let displayedBlessings = [];
    let currentIndex = 0;
    let currentlyDisplayedId = null; // Track which blessing is currently shown
    let isPlaying = true;
    let displayTimeout = null;
    const DISPLAY_DURATION = 8000; // 8 seconds per blessing

    // ============================================
    // DOM Elements
    // ============================================
    const waitingScreen = document.getElementById('waitingScreen');
    const blessingCard = document.getElementById('blessingCard');
    const avatar = document.getElementById('avatar');
    const senderName = document.getElementById('senderName');
    const sendTime = document.getElementById('sendTime');
    const message = document.getElementById('message');
    const photo = document.getElementById('photo');
    const totalCount = document.getElementById('totalCount');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const skipBtn = document.getElementById('skipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const heartsContainer = document.getElementById('heartsContainer');

    // ============================================
    // Floating Hearts Animation
    // ============================================
    const hearts = ['💕', '❤️', '💗', '💖', '💝', '💘', '🥰', '😍'];
    
    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (6 + Math.random() * 4) + 's';
      heartsContainer.appendChild(heart);
      
      setTimeout(() => heart.remove(), 10000);
    }

    // Create floating hearts periodically
    setInterval(createFloatingHeart, 3000);

    // ============================================
    // Time Formatting
    // ============================================
    function formatTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      
      if (diff < 60000) return '剛剛';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分鐘前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小時前';
      
      const date = new Date(timestamp);
      return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    // ============================================
    // Display Blessing
    // ============================================
    function displayBlessing(blessing) {
      // Track currently displayed blessing
      currentlyDisplayedId = blessing.id;
      
      // Hide card first
      blessingCard.classList.remove('show');
      blessingCard.classList.add('hide');

      setTimeout(() => {
        // Update content
        const firstChar = blessing.name.charAt(0);
        avatar.textContent = firstChar;
        senderName.textContent = blessing.name;
        sendTime.textContent = formatTime(blessing.timestamp);
        
        // Handle message
        if (blessing.message) {
          message.textContent = blessing.message;
          message.style.display = 'block';
        } else {
          message.style.display = 'none';
        }

        // Handle photo
        if (blessing.photoURL) {
          photo.src = blessing.photoURL;
          photo.style.display = 'block';
          blessingCard.classList.toggle('photo-only', !blessing.message);
        } else {
          photo.style.display = 'none';
          blessingCard.classList.remove('photo-only');
        }

        // Show card
        blessingCard.classList.remove('hide');
        blessingCard.classList.add('show');
        waitingScreen.classList.add('hidden');

        // Create burst of hearts
        for (let i = 0; i < 5; i++) {
          setTimeout(createFloatingHeart, i * 200);
        }

      }, 400);
    }

    // ============================================
    // Cycle Through Blessings
    // ============================================
    function showNext() {
      if (!isPlaying) return;

      if (blessingQueue.length > 0) {
        // Show new blessing from queue (priority)
        const blessing = blessingQueue.shift();
        displayedBlessings.push(blessing);
        displayBlessing(blessing);
      } else if (displayedBlessings.length > 0) {
        // Recycle through displayed blessings
        currentIndex = currentIndex % displayedBlessings.length;
        displayBlessing(displayedBlessings[currentIndex]);
        currentIndex++;
      } else {
        // No blessings yet
        waitingScreen.classList.remove('hidden');
        blessingCard.classList.remove('show');
      }

      // Schedule next
      displayTimeout = setTimeout(showNext, DISPLAY_DURATION);
    }

    // ============================================
    // Firebase Real-time Listener
    // ============================================
    const blessingsRef = ref(db, 'blessings');

    // Listen for new blessings
    onChildAdded(blessingsRef, (snapshot) => {
      const blessing = { id: snapshot.key, ...snapshot.val() };
      
      // Check if already in displayed (page refresh scenario)
      const alreadyDisplayed = displayedBlessings.some(b => b.id === blessing.id);
      
      if (!alreadyDisplayed) {
        blessingQueue.push(blessing);
        
        // If this is the first blessing and we're waiting
        if (displayedBlessings.length === 0 && blessingQueue.length === 1) {
          clearTimeout(displayTimeout);
          showNext();
        }
      }

      // Update count
      totalCount.textContent = displayedBlessings.length + blessingQueue.length;
    });

    // Listen for deleted blessings (from admin panel)
    onChildRemoved(blessingsRef, (snapshot) => {
      const deletedId = snapshot.key;
      
      // Remove from queue
      blessingQueue = blessingQueue.filter(b => b.id !== deletedId);
      
      // Remove from displayed list
      const displayedIndex = displayedBlessings.findIndex(b => b.id === deletedId);
      if (displayedIndex !== -1) {
        displayedBlessings.splice(displayedIndex, 1);
        
        // Adjust currentIndex if needed
        if (currentIndex > displayedIndex) {
          currentIndex--;
        }
        if (currentIndex >= displayedBlessings.length) {
          currentIndex = 0;
        }
      }
      
      // Update count
      totalCount.textContent = displayedBlessings.length + blessingQueue.length;
      
      // If the currently displayed blessing was deleted, skip to next
      if (currentlyDisplayedId === deletedId) {
        clearTimeout(displayTimeout);
        showNext();
      }
      
      // If no blessings left, show waiting screen
      if (displayedBlessings.length === 0 && blessingQueue.length === 0) {
        blessingCard.classList.remove('show');
        waitingScreen.classList.remove('hidden');
      }
    });

    // Start the display loop
    setTimeout(showNext, 2000);

    // ============================================
    // Controls
    // ============================================
    pauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      pauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      
      if (isPlaying) {
        showNext();
      } else {
        clearTimeout(displayTimeout);
      }
    });

    skipBtn.addEventListener('click', () => {
      clearTimeout(displayTimeout);
      showNext();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });

    // ============================================
    // Preload Images for Smoother Display
    // ============================================
    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
    }
  </script>
</body>
</html>
