<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理後台 | 祝福牆</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Wix Madefor Text', 'Noto Sans TC', sans-serif;
      color: #e0e0e0;
    }

    /* Login Screen */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .login-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-box h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #fff;
    }

    .login-box p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }

    .login-box input:focus {
      border-color: #b39090;
    }

    .login-box input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .login-box input + input {
      margin-top: 0;
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, #b39090, #958282);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(179, 144, 144, 0.4);
    }

    .login-error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }

    .login-error.show {
      display: block;
    }

    /* Main Admin Panel */
    .admin-panel {
      display: none;
      min-height: 100vh;
    }

    .admin-panel.show {
      display: block;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      font-size: 22px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .stats-badge {
      background: rgba(179, 144, 144, 0.2);
      color: #e8c4c4;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }

    .logout-btn {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 107, 107, 0.3);
    }

    /* Search & Filter */
    .toolbar {
      padding: 20px 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 45px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-box input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .search-box .icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .filter-btn.active {
      background: rgba(179, 144, 144, 0.2);
      border-color: rgba(179, 144, 144, 0.4);
    }

    .refresh-btn {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #81c784;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease;
    }

    .refresh-btn:hover {
      background: rgba(76, 175, 80, 0.3);
    }

    .test-data-btn {
      background: rgba(156, 39, 176, 0.2);
      border: 1px solid rgba(156, 39, 176, 0.3);
      color: #ba68c8;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease;
    }

    .test-data-btn:hover {
      background: rgba(156, 39, 176, 0.3);
    }

    .test-data-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .delete-all-btn {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease;
    }

    .delete-all-btn:hover {
      background: rgba(255, 107, 107, 0.25);
    }

    .delete-all-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Storage Bar */
    .storage-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 30px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .storage-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .storage-info .material-symbols-outlined {
      font-size: 18px;
      color: #64b5f6;
    }

    .storage-percent {
      color: rgba(255, 255, 255, 0.5);
    }

    .storage-track {
      flex: 1;
      max-width: 200px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .storage-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #29b6f6);
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s ease, background 0.3s ease;
    }

    .storage-fill.warning {
      background: linear-gradient(90deg, #ffb74d, #ff9800);
    }

    .storage-fill.danger {
      background: linear-gradient(90deg, #ff8a80, #f44336);
    }

    .cleanup-btn {
      background: rgba(255, 183, 77, 0.15);
      border: 1px solid rgba(255, 183, 77, 0.3);
      color: #ffb74d;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.3s ease;
      white-space: nowrap;
    }

    .cleanup-btn:hover {
      background: rgba(255, 183, 77, 0.25);
    }

    .cleanup-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cleanup-btn .material-symbols-outlined {
      font-size: 18px;
    }

    /* Blessings List */
    .blessings-list {
      padding: 0 30px 30px;
    }

    .blessing-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .blessing-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .blessing-item.deleting {
      opacity: 0.5;
      pointer-events: none;
    }

    .blessing-photo {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .blessing-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .blessing-photo img:hover {
      transform: scale(1.05);
    }

    .blessing-photo .no-photo {
      color: rgba(255, 255, 255, 0.3);
      font-size: 40px;
    }

    .blessing-content {
      flex: 1;
      min-width: 0;
    }

    .blessing-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 10px;
    }

    .blessing-name {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .blessing-time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

    .blessing-message {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      word-wrap: break-word;
      position: relative;
    }

    .blessing-color {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .blessing-color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: inline-block;
    }

    .blessing-message.empty {
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    .blessing-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .delete-btn {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: rgba(255, 107, 107, 0.25);
    }

    .delete-btn .material-symbols-outlined {
      font-size: 18px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #b39090;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Image Modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .image-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    .image-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease;
    }

    .image-modal .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Confirm Dialog */
    .confirm-dialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .confirm-dialog.show {
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-box {
      background: #2d2d44;
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .confirm-box h3 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #fff;
    }

    .confirm-box p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 25px;
    }

    .confirm-box .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .confirm-box .cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .confirm-box .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .confirm-box .confirm-btn {
      background: #ff6b6b;
      border: none;
      color: #fff;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .confirm-box .confirm-btn:hover {
      background: #ff5252;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 4000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: rgba(76, 175, 80, 0.9);
    }

    .toast.error {
      background: rgba(244, 67, 54, 0.9);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 15px 20px;
      }

      .header h1 {
        font-size: 18px;
      }

      .toolbar {
        padding: 15px 20px;
      }

      .blessings-list {
        padding: 0 20px 20px;
      }

      .blessing-item {
        flex-direction: column;
        padding: 15px;
      }

      .blessing-photo {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>🔐 管理後台</h1>
      <p>請使用管理員帳號登入</p>
      <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
      <input type="password" id="passwordInput" placeholder="密碼" autocomplete="current-password">
      <button id="loginBtn">登入</button>
      <div class="login-error" id="loginError">登入失敗，請檢查帳號密碼</div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <header class="header">
      <h1>
        <span class="material-symbols-outlined">admin_panel_settings</span>
        祝福牆管理
      </h1>
      <div class="header-actions">
        <div class="stats-badge">
          共 <span id="totalCount">0</span> 則祝福
        </div>
        <button class="logout-btn" id="logoutBtn">登出</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <span class="material-symbols-outlined icon">search</span>
        <input type="text" id="searchInput" placeholder="搜尋名字或內容...">
      </div>
      <button class="filter-btn" id="photoFilterBtn">
        <span class="material-symbols-outlined">photo_camera</span>
        只顯示照片
      </button>
      <button class="filter-btn" id="textFilterBtn">
        <span class="material-symbols-outlined">chat</span>
        只顯示文字
      </button>
      <button class="refresh-btn" id="refreshBtn">
        <span class="material-symbols-outlined">refresh</span>
        重新載入
      </button>
      <button class="test-data-btn" id="testDataBtn">
        <span class="material-symbols-outlined">science</span>
        加入測試資料
      </button>
      <button class="test-data-btn" id="emojiBlastBtn" style="background: rgba(233, 93, 117, 0.2); border-color: rgba(233, 93, 117, 0.3); color: #f48fb1;">
        <span class="material-symbols-outlined">celebration</span>
        發送 50 個 Emoji
      </button>
      <button class="delete-all-btn" id="deleteAllBtn">
        <span class="material-symbols-outlined">delete_sweep</span>
        全部刪除
      </button>
    </div>

    <div class="storage-bar" id="storageBar">
      <div class="storage-info">
        <span class="material-symbols-outlined">cloud</span>
        <span>儲存空間：<strong id="storageUsed">0 MB</strong> / 5 GB</span>
        <span class="storage-percent" id="storagePercent">(0%)</span>
      </div>
      <div class="storage-track">
        <div class="storage-fill" id="storageFill"></div>
      </div>
      <button class="cleanup-btn" id="cleanupBtn" title="刪除最舊的照片祝福">
        <span class="material-symbols-outlined">auto_delete</span>
        清理舊照片
      </button>
    </div>

    <div class="blessings-list" id="blessingsList">
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>載入中...</p>
      </div>
    </div>
  </div>

  <!-- Image Modal -->
  <div class="image-modal" id="imageModal">
    <button class="close-btn" id="closeImageBtn">
      <span class="material-symbols-outlined">close</span>
    </button>
    <img id="modalImage" src="" alt="">
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-dialog" id="confirmDialog">
    <div class="confirm-box">
      <h3>確認刪除？</h3>
      <p id="confirmMessage">此操作無法復原</p>
      <div class="buttons">
        <button class="cancel-btn" id="cancelDeleteBtn">取消</button>
        <button class="confirm-btn" id="confirmDeleteBtn">刪除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { getDatabase, ref, onValue, remove, query, orderByChild, push } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";
    import { getStorage, ref as storageRef, deleteObject, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

    // ============================================
    // 🔥 Firebase Configuration
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyDD-klcHuiIXBY9f4rjuDR-7aDyKrXICv0",
      authDomain: "wedding-e335c.firebaseapp.com",
      databaseURL: "https://wedding-e335c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wedding-e335c",

    // ============================================
    // Storage Display
    // ============================================
    function updateStorageDisplay() {
      // Calculate total storage from tracked file sizes
      let totalBytes = 0;
      let photoCount = 0;
      
      allBlessings.forEach(b => {
        if (b.fileSize) {
          totalBytes += b.fileSize;
          photoCount++;
        } else if (b.photoURL) {
          // Estimate ~2MB for photos without tracked size (legacy)
          totalBytes += 2 * 1024 * 1024;
          photoCount++;
        } else if (b.videoURL) {
          // Estimate ~10MB for videos without tracked size
          totalBytes += 10 * 1024 * 1024;
          photoCount++; // Count videos as photos for display purposes
        }
      });

      // Update display
      const mb = totalBytes / (1024 * 1024);
      const gb = totalBytes / (1024 * 1024 * 1024);
      const percent = (totalBytes / STORAGE_LIMIT) * 100;

      if (gb >= 1) {
        storageUsed.textContent = gb.toFixed(2) + ' GB';
      } else {
        storageUsed.textContent = mb.toFixed(1) + ' MB';
      }
      
      storagePercent.textContent = `(${percent.toFixed(1)}%)`;
      storageFill.style.width = Math.min(percent, 100) + '%';
      
      // Color coding
      storageFill.classList.remove('warning', 'danger');
      if (percent >= 80) {
        storageFill.classList.add('danger');
      } else if (percent >= 50) {
        storageFill.classList.add('warning');
      }

      // Enable/disable cleanup button
      cleanupBtn.disabled = photoCount === 0;
    }

    async function cleanupOldPhotos() {
      // Get photo and video blessings sorted by timestamp (oldest first)
      const mediaBlessings = allBlessings
        .filter(b => b.photoURL || b.videoURL)
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      if (mediaBlessings.length === 0) {
        showToast('沒有照片或影片可以清理', 'error');
        return;
      }

      // Calculate how many to delete (oldest 20% or at least 1)
      const deleteCount = Math.max(1, Math.ceil(mediaBlessings.length * 0.2));
      const toDelete = mediaBlessings.slice(0, deleteCount);
      
      // Calculate size to free
      let sizeToFree = 0;
      toDelete.forEach(b => {
        sizeToFree += b.fileSize || (2 * 1024 * 1024);
      });
      const mbToFree = (sizeToFree / (1024 * 1024)).toFixed(1);

      confirmMessage.textContent = `將刪除 ${deleteCount} 則最舊的照片/影片祝福（約釋放 ${mbToFree} MB）。此操作無法復原！`;

    async function createTestImage(color, text) {
      // Create a canvas with a colored background and text
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 600;
      const ctx = canvas.getContext('2d');
      
      // Draw gradient background
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, adjustColor(color, -20));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Add text
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      
      // Convert to blob
      return new Promise((resolve) => {
        canvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', 0.9);
      });
    }

    function adjustColor(color, amount) {
      // Simple color adjustment for gradient
      const num = parseInt(color.replace('#', ''), 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }

      const hours = String(date.getHours()).padStart(2, '0');

    cancelDeleteBtn.addEventListener('click', () => {
      confirmDialog.classList.remove('show');
      pendingDeleteId = null;
      pendingDeletePhotoURL = null;
      isDeleteAllMode = false;
      pendingCleanup = null;
    });

    confirmDeleteBtn.addEventListener('click', async () => {
      confirmDialog.classList.remove('show');
      
      // Handle Cleanup
      if (pendingCleanup && pendingCleanup.length > 0) {
        await executeCleanup();
        return;
      }
      
      // Handle Delete All
      if (isDeleteAllMode) {
        isDeleteAllMode = false;
        await deleteAllBlessings();
        return;
      }
      
      // Handle Single Delete
      if (!pendingDeleteId) return;
      
      const itemElement = document.querySelector(`[data-id="${pendingDeleteId}"]`);
      if (itemElement) {
        itemElement.classList.add('deleting');
      }

      try {
        // Delete from database
        await remove(ref(db, `blessings/${pendingDeleteId}`));
        
        // Delete photo or video from storage if exists
        if (pendingDeletePhotoURL) {
          const blessing = filteredBlessings.find(b => b.id === pendingDeleteId);
          if (blessing && blessing.videoURL) {
            await deleteVideoFromStorage(pendingDeletePhotoURL);
          } else {
            await deletePhotoFromStorage(pendingDeletePhotoURL);
          }
        }
        
        showToast('已刪除', 'success');
        
      } catch (error) {
        console.error('Error deleting blessing:', error);
        showToast('刪除失敗', 'error');
        if (itemElement) {
          itemElement.classList.remove('deleting');
        }
      }
      
      pendingDeleteId = null;
      pendingDeletePhotoURL = null;
    });

    // ============================================
    // Delete Photo Helper
    // ============================================
    async function deletePhotoFromStorage(photoURL) {
      if (!photoURL) return;
      
      try {
        const urlObj = new URL(photoURL);
        // Match Firebase Storage URL pattern: /o/path%2Fto%2Ffile.jpg
        const pathMatch = urlObj.pathname.match(/\/o\/(.+?)(?:\?|$)/);
        if (pathMatch) {
          const filePath = decodeURIComponent(pathMatch[1]);
          console.log('Deleting photo from storage:', filePath);
          const photoRef = storageRef(storage, filePath);
          await deleteObject(photoRef);
          console.log('Photo deleted successfully');
        } else {
          console.warn('Could not parse photo URL:', photoURL);
        }
      } catch (storageError) {
        console.warn('Could not delete photo from storage:', storageError.message);
      }
    }

    async function deleteVideoFromStorage(videoURL) {
      if (!videoURL) return;
      
      try {
        const urlObj = new URL(videoURL);
        // Match Firebase Storage URL pattern: /o/path%2Fto%2Ffile.mp4
        const pathMatch = urlObj.pathname.match(/\/o\/(.+?)(?:\?|$)/);
        if (pathMatch) {
          const filePath = decodeURIComponent(pathMatch[1]);
          console.log('Deleting video from storage:', filePath);
          const videoRef = storageRef(storage, filePath);
          await deleteObject(videoRef);
          console.log('Video deleted successfully');
        } else {
          console.warn('Could not parse video URL:', videoURL);
        }
      } catch (storageError) {
        console.warn('Could not delete video from storage:', storageError.message);
      }
    }

    // ============================================
    // Delete All Blessings
    // ============================================
    deleteAllBtn.addEventListener('click', () => {
      if (allBlessings.length === 0) {
        showToast('沒有可刪除的祝福', 'error');
        return;
      }
      
      isDeleteAllMode = true;
      confirmMessage.textContent = `確定要刪除全部 ${allBlessings.length} 則祝福嗎？此操作無法復原！`;
      confirmDialog.classList.add('show');
    });

    async function deleteAllBlessings() {
      deleteAllBtn.disabled = true;
      deleteAllBtn.innerHTML = '<span class="material-symbols-outlined">hourglass_empty</span> 刪除中...';
      
      let successCount = 0;
      let failCount = 0;
      const totalToDelete = allBlessings.length;

      try {
        // Delete all blessings and their photos
        for (const blessing of allBlessings) {
          try {
            // Delete from database
            await remove(ref(db, `blessings/${blessing.id}`));
            
            // Delete photo if exists
            if (blessing.photoURL) {
              await deletePhotoFromStorage(blessing.photoURL);
            } else if (blessing.videoURL) {
              await deleteVideoFromStorage(blessing.videoURL);
            }
            
            successCount++;
          } catch (error) {
            console.error(`Error deleting blessing ${blessing.id}:`, error);
            failCount++;
          }
        }

        if (failCount === 0) {
          showToast(`已刪除全部 ${successCount} 則祝福`, 'success');
        } else {
          showToast(`已刪除 ${successCount} 則，${failCount} 則失敗`, 'error');
        }

      } catch (error) {
        console.error('Error in deleteAllBlessings:', error);
        showToast('刪除失敗', 'error');
      } finally {
        deleteAllBtn.disabled = false;
        deleteAllBtn.innerHTML = '<span class="material-symbols-outlined">delete_sweep</span> 全部刪除';
      }
    }

    // ============================================
    // Initialize
    // ============================================
    // Firebase Auth's onAuthStateChanged handles initialization automatically
  </script>
</body>
</html>
